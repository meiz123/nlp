name: Build desktop apps
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: python -m unittest discover -s tests -v
      - run: python -m PyInstaller --noconfirm --windowed --name LocalizationQA --collect-all keyring run.py
      - name: Package macOS app
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/LocalizationQA.app dist/LocalizationQA-mac-arm64.zip
      - name: Package Windows app
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/LocalizationQA -DestinationPath dist/LocalizationQA-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: LocalizationQA-${{ matrix.os }}
          path: dist/*.zip
